name: Sync Fork

on:
  schedule:
    - cron: '0 * * * *'  # 每小时检查一次
  workflow_dispatch:      # 允许手动触发

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add upstream
        run: |
          git remote add upstream https://github.com/hebijunge/tvbox-config.git
          git fetch upstream
          git checkout main
          git merge upstream/main --no-edit
          git push origin main
